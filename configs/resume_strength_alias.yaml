# - 只处理“同一能力的不同写法”，不把上下位概念强行合并。
# - 主要服务人工评估集、API 后处理和后续 SFT 数据清洗，让标签粒度稳定。
#
# 维护原则：
# - canonical 写项目中希望稳定输出的短标签。
# - aliases 写模型/简历里常见的自然语言表达。
# - 不在这里放岗位方向、技能清单的完整同义词；技能归一化仍放在 label_schema.yaml。
