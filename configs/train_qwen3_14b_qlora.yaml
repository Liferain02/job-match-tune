model_name_or_path: models/Qwen3-14B
output_dir: outputs/checkpoints/qwen3-14b-jobmatch-qlora

train_file: data/sft_multitask/train.jsonl
valid_file: data/sft_multitask/valid.jsonl
max_eval_samples: 320

# 经证据保留压缩和 tokenizer 审计，当前全部训练样本均可保留完整答案。
max_seq_length: 1536
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
num_train_epochs: 1
learning_rate: 1.0e-4
warmup_steps: 20
weight_decay: 0.0
lr_scheduler_type: cosine
logging_steps: 10
save_steps: 100
save_total_limit: 2
eval_steps: 300
bf16: true
gradient_checkpointing: true
seed: 42

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

quantization:
  use_4bit: true
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true

generation:
  enable_thinking: false
  temperature: 0.1
  top_p: 0.8
  max_new_tokens: 1024

performance:
  attn_implementation: sdpa
  packing: false
  packing_strategy: bfd
  loss_type: dft
  use_liger_kernel: false
  activation_offloading: false
