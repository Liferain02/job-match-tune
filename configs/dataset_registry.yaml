multitask_sft:
  train_out: data/sft_multitask/train.jsonl
  valid_out: data/sft_multitask/valid.jsonl
  seed: 42
  tasks:
    jd:
      train_file: data/sft_jd_strict_plus/train.jsonl
      valid_file: data/sft_jd_strict_plus/valid.jsonl
      train_samples: 1347
      valid_samples: 168
    resume:
      train_file: data/sft_resume/train.jsonl
      valid_file: data/sft_resume/valid.jsonl
      # Keep every available unique resume; min(sample_count, rows) still makes
      # this a deterministic upper bound instead of duplicating examples.
      train_samples: 1000
      valid_samples: 20
    match:
      train_file: data/sft_match/train.jsonl
      valid_file: data/sft_match/valid.jsonl
      train_samples: 100
      valid_samples: 20
